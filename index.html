<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>반응속도 측정기</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app" class="screen screen--idle">
      <div class="hit-zone" data-role="hit-zone" hidden></div>
      <div class="panel">
        <h1>반응속도 측정기</h1>
        <p class="message" data-role="message">
          버튼을 누르면 게임이 시작됩니다.<br />
          화면이 <strong>빨간색</strong>으로 바뀌면 최대한 빨리 클릭하세요!
        </p>
        <button type="button" class="action-button" data-role="start-button">시작하기</button>

        <div class="result" data-role="result" hidden>
          <p class="result-time" data-role="result-time"></p>
          <form class="nickname-form" data-role="nickname-form">
            <input
              type="text"
              class="nickname-input"
              data-role="nickname-input"
              placeholder="닉네임을 입력하세요 (최대 20자)"
              maxlength="20"
              required
            />
            <button type="submit" class="action-button" data-role="save-button">기록 저장</button>
          </form>
          <p class="save-status" data-role="save-status"></p>
          <button type="button" class="action-button" data-role="retry-button">다시 하기</button>
        </div>

        <div class="ranking" data-role="ranking">
          <div class="ranking-header">
            <h2>최고 기록 랭킹</h2>
            <button type="button" class="link-button" data-role="full-ranking-button">전체 랭킹 보기</button>
          </div>
          <ol class="ranking-list" data-role="ranking-list"></ol>
        </div>
      </div>

      <div class="modal-overlay" data-role="full-ranking-overlay" hidden>
        <div class="modal">
          <div class="modal-header">
            <h2>전체 랭킹</h2>
            <button type="button" class="action-button" data-role="full-ranking-close">닫기</button>
          </div>
          <ol class="ranking-list ranking-list--full" data-role="full-ranking-list"></ol>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
